name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and regression tests
        run: npm test

      - name: Run semantic retrieval benchmark
        run: npm run eval:retrieval

      - name: Build application
        run: npm run build

  python-retrieval-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/retrieval_api/pyproject.toml

      - name: Install retrieval service
        run: python -m pip install -e 'services/retrieval_api[dev]'

      - name: Lint Python service
        run: ruff check services/retrieval_api

      - name: Test Python service
        run: pytest services/retrieval_api/tests
